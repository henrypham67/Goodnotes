kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: load-test
nodes:
- role: control-plane
  # patch for ingress controller
  # reachable on port 80/443
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
- role: worker
- role: worker
