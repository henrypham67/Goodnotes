name: Runs randomised load test on PR
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  randomised_load_test:
    name: Randomised load test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6
      # GRADERS NOTE unncessary     
      # Install debugging tools for troubleshooting
      - name: Install diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl wget htop net-tools dnsutils tcpdump

      # GRADERS NOTE unncessary
      # Install some prerequisites tools
      - name: Install kubectl
        run: |
          curl -LO https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          which kubectl
          kubectl version --client
          
      # Start the cluster for running http echo
      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          config: ./tests/kind-cluster.yaml
          cluster_name: load-test
      - run: |
          kubectl cluster-info
          kubectl version
          kubectl config current-context
      - name: Set up nginx ingress
        run: |
          kubectl apply -k overlays/shared
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s
      - name: Set up app
        run: |
          kubectl apply -k overlays/load/foo
          kubectl apply -k overlays/load/bar
          kubectl wait --for=condition=ready pod --selector='app in (foo,bar)' --timeout=120s
          sleep 15 # make sure it's ready
      # NOTE: we build our own k6 because of 
      # this marketplace action issue https://github.com/grafana/k6-action/tree/2bd221c807b7cdbe4bb3abc6b3fa4d2da499fa9b?tab=readme-ov-file#side-by-side-with-the-system-under-test
      - name: Install k6 
        run: |
          # GRADERS NOTE uncessary to build from source
          # Install Go to build k6 from source
          wget -q https://go.dev/dl/go1.21.5.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.21.5.linux-amd64.tar.gz
          export PATH=$PATH:/usr/local/go/bin
          # Clone and build k6
          git clone https://github.com/grafana/k6.git
          cd k6
          go build .
          sudo mv k6 /usr/local/bin/
          cd ..
          # Verify installation
          k6 version
      - name: Run randomised load test
        run: |
          mkdir test-output
          k6 run tests/load-test.js
          
      - name: Upload performance test results txt
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary.txt
          path: ./test-output/summary.txt
      - name: Upload performance test results json
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary.json
          path: ./test-output/summary.json
      - name: Find summary comment
        if: github.event_name == 'pull_request'
        id: fc
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-regex: 'Visit .*'
      - name: Upsert summary on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ./test-output/summary-gh-comment.txt
          edit-mode: replace
